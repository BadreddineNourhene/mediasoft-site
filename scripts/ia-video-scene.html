<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#0b3a86;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "./node_modules/three/examples/jsm/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "./node_modules/three/examples/jsm/environments/RoomEnvironment.js";

/* Vidéo « IA & innovation » — inspirée de l'univers de digitalapple.ai (structure de cubes de verre en grille,
   vagues de cubes, écrans d'application en verre qui flottent, sphères, dunes), en studio BLEU aux couleurs Mediasoft. */

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rand = (a, b) => a + rnd() * (b - a);

const scene = new THREE.Scene();
const BG = new THREE.Color("#0d3f8f");
scene.background = BG;
scene.fog = new THREE.Fog(BG, 16, 34);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

const key = new THREE.DirectionalLight("#dbe9ff", 2.6);
key.position.set(-5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
key.shadow.radius = 8;
scene.add(key);
scene.add(new THREE.HemisphereLight("#bcd8ff", "#0a2a66", 0.9));
const rim = new THREE.PointLight("#ff9a5c", 30, 18);
rim.position.set(4, 3, -3);
scene.add(rim);

// Mur courbe (salle circulaire) + sol en dunes + socle
const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(15, 15, 16, 128, 1, true, Math.PI * 0.55, Math.PI * 0.9),
  new THREE.MeshStandardMaterial({ color: "#1a56b0", roughness: 0.9, side: THREE.BackSide })
);
wall.position.set(1.5, 7, -2);
scene.add(wall);

const floorGeo = new THREE.PlaneGeometry(70, 70, 260, 260);
const fp = floorGeo.attributes.position;
for (let i = 0; i < fp.count; i++) {
  const x = fp.getX(i), y = fp.getY(i);
  const d = Math.hypot(x, y);
  const dune = d > 4.2 ? Math.sin(x * 1.4 + y * 0.6 + d * 0.8) * 0.045 + Math.sin(d * 3.1) * 0.03 : 0;
  fp.setZ(i, dune);
}
floorGeo.computeVertexNormals();
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: "#1b4fa6", roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

for (let k = 0; k < 2; k++) {
  const r = 3.3 - k * 0.5;
  const step = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.24, 128), new THREE.MeshStandardMaterial({ color: "#cfe0f6", roughness: 0.5 }));
  step.position.set(2.6, 0.12 + k * 0.24, 0);
  step.castShadow = step.receiveShadow = true;
  scene.add(step);
}
const TOP = 0.48;

// ---------- Structure de cubes de verre (grille en losange, dégradé) ----------
const S = 0.26; // pas de grille
const cubeGeo = new RoundedBoxGeometry(S * 0.86, S * 0.86, S * 0.86, 2, 0.03);
const cubeMat = new THREE.MeshPhysicalMaterial({ roughness: 0.08, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.66, ior: 1.4, specularIntensity: 1 });
const cells = [];
const HALF = 9;
const CY = TOP + 2.55; // centre vertical de la structure
for (let ix = -HALF; ix <= HALF; ix++)
  for (let iy = -HALF; iy <= HALF; iy++)
    for (let iz = -HALF; iz <= HALF; iz++) {
      const x = ix * S, y = iy * S, z = iz * S;
      // losange (octaèdre arrondi), creux à l'intérieur pour alléger
      const m = Math.abs(x) / 2.25 + Math.abs(y) / 2.35 + Math.abs(z) / 2.25;
      if (m > 1 || m < 0.62) continue;
      if (rnd() < 0.18) continue; // irrégularité
      cells.push({ x, y, z });
    }
const N = cells.length;
const mesh = new THREE.InstancedMesh(cubeGeo, cubeMat, N);
mesh.castShadow = true;
scene.add(mesh);

const cTop = new THREE.Color("#ffffff"), cMid = new THREE.Color("#5fb4ff"), cLow = new THREE.Color("#1e6fd6"), cBot = new THREE.Color("#ff7a2e");
const data = cells.map((c) => {
  const h = (c.y + 2.35) / 4.7; // 0 bas → 1 haut
  const col = new THREE.Color();
  if (h > 0.62) col.copy(cMid).lerp(cTop, (h - 0.62) / 0.38 * 0.8);
  else if (h > 0.34) col.copy(cLow).lerp(cMid, (h - 0.34) / 0.28);
  else col.copy(cBot).lerp(cLow, h / 0.34 * 0.6);
  // vague : les cubes du côté droit s'envolent en nappe vers la droite puis reviennent
  const side = c.x > 0.15 ? 1 : c.x < -0.6 ? -1 : 0;
  return {
    ...c,
    col,
    side,
    phase: (c.x + 2.3) / 4.6 + rand(-0.06, 0.06),
    lift: new THREE.Vector3(side * rand(2.5, 6.5), rand(-0.6, 1.4), rand(-1.5, 2.2)),
    spin: rand(-2, 2),
  };
});
data.forEach((d, i) => mesh.setColorAt(i, d.col));
mesh.instanceColor.needsUpdate = true;

// ---------- Écrans d'application en verre (UI dessinée) ----------
function uiTexture(kind) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = kind === "phone" ? 1024 : 360;
  const g = c.getContext("2d");
  const rr = (x, y, w, h, r, f) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = f; g.fill(); };
  rr(0, 0, c.width, c.height, 44, "rgba(255,255,255,0.82)");
  if (kind === "phone") {
    rr(170, 30, 172, 34, 17, "rgba(10,40,100,0.55)");
    rr(40, 110, 432, 120, 28, "rgba(255,255,255,0.85)");
    rr(70, 145, 50, 50, 25, "#1d6fb8"); rr(140, 150, 220, 18, 9, "#0b1a2e"); rr(140, 180, 160, 14, 7, "rgba(11,26,46,0.35)");
    rr(40, 260, 432, 260, 32, "#ff8a3d");
    rr(70, 300, 200, 22, 11, "rgba(255,255,255,0.95)"); rr(70, 338, 140, 16, 8, "rgba(255,255,255,0.7)");
    rr(40, 550, 205, 200, 30, "rgba(95,180,255,0.9)"); rr(267, 550, 205, 200, 30, "rgba(255,255,255,0.85)");
    const bars = [60, 95, 75, 130, 110, 160];
    bars.forEach((b, i) => rr(300 + i * 26, 720 - b, 16, b, 6, i === 5 ? "#ff8a3d" : "#1d6fb8"));
    rr(40, 780, 432, 190, 32, "rgba(255,255,255,0.85)");
    g.strokeStyle = "#1d6fb8"; g.lineWidth = 9; g.beginPath();
    [0, 40, 25, 70, 55, 110, 95, 140].forEach((v, i) => (i ? g.lineTo(70 + i * 52, 930 - v) : g.moveTo(70, 930 - v)));
    g.stroke();
  } else if (kind === "chat") {
    rr(30, 40, 300, 70, 30, "#1d6fb8"); rr(55, 65, 220, 18, 9, "rgba(255,255,255,0.9)");
    rr(180, 140, 300, 70, 30, "rgba(255,255,255,0.95)"); rr(205, 165, 200, 18, 9, "rgba(11,26,46,0.45)");
    rr(30, 240, 140, 60, 30, "rgba(255,255,255,0.95)");
    [70, 100, 130].forEach((x) => rr(x, 262, 16, 16, 8, "#1d6fb8"));
  } else {
    rr(30, 30, 140, 22, 11, "#0b1a2e"); rr(30, 70, 90, 14, 7, "rgba(11,26,46,0.35)");
    const bars = [80, 120, 95, 170, 140, 210, 180, 250];
    bars.forEach((b, i) => rr(40 + i * 56, 330 - b, 36, b, 10, i === 7 ? "#ff8a3d" : i % 3 ? "#1d6fb8" : "#5fb4ff"));
    g.beginPath(); g.arc(430, 85, 50, 0, Math.PI * 2); g.lineWidth = 22; g.strokeStyle = "rgba(29,111,184,0.25)"; g.stroke();
    g.beginPath(); g.arc(430, 85, 50, -Math.PI / 2, Math.PI * 0.9); g.strokeStyle = "#ff8a3d"; g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function glassPanel(kind, w, h) {
  const grp = new THREE.Group();
  const frame = new THREE.Mesh(
    new RoundedBoxGeometry(w, h, 0.06, 4, Math.min(w, h) * 0.12),
    new THREE.MeshPhysicalMaterial({ color: "#ffffff", roughness: 0.15, clearcoat: 1, transparent: true, opacity: 0.25 })
  );
  frame.castShadow = true;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.94, h * 0.95), new THREE.MeshBasicMaterial({ map: uiTexture(kind), transparent: true, toneMapped: false }));
  face.position.z = 0.035;
  grp.add(frame, face);
  return grp;
}
const phone = glassPanel("phone", 1.3, 2.6);
const dash = glassPanel("dash", 2.5, 1.75);
const chat = glassPanel("chat", 1.8, 1.14);
scene.add(phone, dash, chat);

// Sphères et anneau lumineux
const orbMat = new THREE.MeshPhysicalMaterial({ color: "#ff8a3d", roughness: 0.2, clearcoat: 1 });
const orb1 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 48, 48), orbMat);
const orb2 = new THREE.Mesh(new THREE.SphereGeometry(0.13, 48, 48), new THREE.MeshPhysicalMaterial({ color: "#ffffff", roughness: 0.1, clearcoat: 1 }));
const ring = new THREE.Group();
const torus = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.09, 32, 96), new THREE.MeshPhysicalMaterial({ color: "#7cc4ff", roughness: 0.15, clearcoat: 1, transparent: true, opacity: 0.85 }));
const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.2, 48, 48), new THREE.MeshPhysicalMaterial({ color: "#eaf4ff", roughness: 0.05, metalness: 0.3, clearcoat: 1 }));
ring.add(torus, pearl);
[orb1, orb2, ring].forEach((o) => { o.traverse((m) => (m.castShadow = true)); scene.add(o); });

// Poussière de petits cubes
const DUST = 70;
const dust = new THREE.InstancedMesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), new THREE.MeshPhysicalMaterial({ color: "#9fd0ff", roughness: 0.15, clearcoat: 1, transparent: true, opacity: 0.8 }), DUST);
const dustData = Array.from({ length: DUST }, () => ({ p: new THREE.Vector3(rand(-9, 9), rand(0.5, 7), rand(-6, 4)), s: rand(0.4, 1.4), ph: rand(0, 6.28) }));
scene.add(dust);

const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3(), base = new THREE.Vector3();
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const clamp = (x) => Math.min(1, Math.max(0, x));

window.renderFrame = (t) => {
  const T = t * Math.PI * 2;
  const rotY = Math.sin(T) * 0.35;
  // vague : 0→1→0 sur la boucle, décalée selon la position du cube
  for (let i = 0; i < N; i++) {
    const d = data[i];
    const w = d.side === 0 ? 0 : clamp(Math.sin(T - d.phase * 2.2) * 1.35 - 0.35);
    const k = ease(w);
    base.set(d.x * Math.cos(rotY) - d.z * Math.sin(rotY) + 2.6, d.y + CY, d.x * Math.sin(rotY) + d.z * Math.cos(rotY));
    p.copy(base).addScaledVector(d.lift, k);
    p.y += Math.sin(T * 2 + d.phase * 6) * 0.015;
    e.set(k * d.spin, rotY + k * d.spin * 1.5, k * d.spin * 0.5);
    q.setFromEuler(e);
    const s = 1 - k * 0.25;
    sc.set(s, s, s);
    m4.compose(p, q, sc);
    mesh.setMatrixAt(i, m4);
  }
  mesh.instanceMatrix.needsUpdate = true;

  // écrans flottants
  phone.position.set(0.3, 2.9 + Math.sin(T) * 0.18, 1.6);
  phone.rotation.set(0.05, 0.45 + Math.sin(T) * 0.12, -0.06);
  dash.position.set(5.9, 3.7 + Math.sin(T + 1.7) * 0.15, 0.2);
  dash.rotation.set(-0.04, -0.5 + Math.sin(T + 1) * 0.08, 0.03);
  chat.position.set(1.2, 5.6 + Math.sin(T + 3) * 0.14, -0.8);
  chat.rotation.set(0.06, 0.3, 0.04);
  orb1.position.set(0.9, TOP + 0.22 + Math.abs(Math.sin(T * 2)) * 0.35, 1.9);
  orb2.position.set(4.9, 1.4 + Math.sin(T + 2) * 0.25, 2.2);
  ring.position.set(4.3, 5.7 + Math.sin(T + 0.5) * 0.2, 0.8);
  ring.rotation.set(0.2, T, 0);

  dustData.forEach((d, i) => {
    p.copy(d.p);
    p.x += Math.sin(T + d.ph) * 0.25 * d.s;
    p.y += Math.cos(T + d.ph) * 0.2 * d.s;
    e.set(T * d.s, T * d.s * 0.7, 0);
    q.setFromEuler(e);
    sc.setScalar(d.s);
    m4.compose(p, q, sc);
    dust.setMatrixAt(i, m4);
  });
  dust.instanceMatrix.needsUpdate = true;

  const ca = 0.12 + Math.sin(T) * 0.1;
  camera.position.set(Math.sin(ca) * 15 + 0.3, 3.6 + Math.sin(T) * 0.15, Math.cos(ca) * 15);
  camera.lookAt(0.5, 2.9, 0);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
