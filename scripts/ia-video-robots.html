<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;overflow:hidden;background:#0d3f8f}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "./node_modules/three/examples/jsm/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "./node_modules/three/examples/jsm/environments/RoomEnvironment.js";

/* Robots Mediasoft (originaux) — mode=hero : grande tête de robot traversée par un flot de cubes (animé, fond bleu) ;
   mode=table : trois petits robots sur une table (image fixe). */
const mode = new URLSearchParams(location.search).get("mode") || "hero";
const W = 1280, H = mode === "table" ? 960 : 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = mode === "table" ? 1.0 : 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

let seed = 5;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rand = (a, b) => a + rnd() * (b - a);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

// Robot « galet » : corps lisse, visière noire brillante, yeux lumineux
function makeRobot({ body = "#eef3fb", eye = "#9fe3ff", scale = 1, glow = "#5fb4ff" } = {}) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: body, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.3 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), bodyMat);
  shell.scale.set(1, 1.08, 0.95);
  shell.castShadow = shell.receiveShadow = true;
  g.add(shell);
  // visière : calotte sphérique noire
  const visor = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 96, 64, Math.PI * 0.27, Math.PI * 0.46, Math.PI * 0.36, Math.PI * 0.25),
    new THREE.MeshPhysicalMaterial({ color: "#0b1220", roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02, metalness: 0.2 })
  );
  visor.scale.copy(shell.scale);
  g.add(visor);
  // yeux
  const eyeMat = new THREE.MeshBasicMaterial({ color: eye, toneMapped: false });
  const eyes = [];
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.1, 8, 24), eyeMat);
    e.position.set(sx * 0.22, 0.08, 1.0);
    e.rotation.x = -0.1;
    g.add(e);
    eyes.push(e);
  }
  // anneau lumineux à la base
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.035, 16, 96), new THREE.MeshBasicMaterial({ color: glow, toneMapped: false }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -0.86;
  g.add(ring);
  g.scale.setScalar(scale);
  g.userData.eyes = eyes;
  return g;
}

if (mode === "table") {
  // ----- Trois petits robots sur une table, lumière chaude, fond clair -----
  scene.background = new THREE.Color("#e9e2d8");
  scene.environmentIntensity = 0.6;
  const sun = new THREE.DirectionalLight("#fff1dc", 3);
  sun.position.set(-6, 9, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.radius = 6;
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
  scene.add(sun, new THREE.HemisphereLight("#fff8ee", "#b4a894", 0.8));
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: "#e4dbcf", roughness: 1 }));
  wall.position.set(0, 6, -5);
  wall.receiveShadow = true;
  scene.add(wall);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: "#d6ccbe", roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  const table = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.28, 128), new THREE.MeshStandardMaterial({ color: "#cfc4b4", roughness: 0.6 }));
  table.position.y = 1.4;
  table.castShadow = table.receiveShadow = true;
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.4, 1.4, 64), new THREE.MeshStandardMaterial({ color: "#c7bba9", roughness: 0.7 }));
  foot.position.y = 0.7;
  foot.castShadow = true;
  scene.add(table, foot);
  const T = 1.54;
  const robots = [
    { o: { body: "#ff9a6b", eye: "#ffe7d6", glow: "#ffb38a", scale: 0.78 }, p: [0.1, T + 0.68, 0.9], r: 0.1 },
    { o: { body: "#cfe9dc", eye: "#bff5df", glow: "#8fe0bf", scale: 0.48 }, p: [-1.9, T + 0.42, -0.4], r: 0.45 },
    { o: { body: "#b9d3ff", eye: "#d8ecff", glow: "#7fb6ff", scale: 0.55 }, p: [2.0, T + 0.48, -0.5], r: -0.4 },
    { o: { body: "#d9c9ff", eye: "#efe6ff", glow: "#b49cff", scale: 0.42 }, p: [1.3, T + 0.37, -1.9], r: -0.2 },
  ];
  robots.forEach(({ o, p, r }) => {
    const rb = makeRobot(o);
    rb.position.set(...p);
    rb.rotation.y = r;
    scene.add(rb);
  });
  // carnet + tasse
  const book = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.06, 0.8, 2, 0.02), new THREE.MeshStandardMaterial({ color: "#f3efe8" }));
  book.position.set(-1.2, T + 0.03, 1.4); book.rotation.y = 0.3; book.castShadow = true;
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.36, 48), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.3 }));
  cup.position.set(-2.4, T + 0.18, 0.7); cup.castShadow = true;
  scene.add(book, cup);
  // suspension
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.1, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: "#bdb3a4", roughness: 0.8, side: THREE.DoubleSide }));
  lamp.position.set(0.3, 6.3, 0); scene.add(lamp);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 4), new THREE.MeshBasicMaterial({ color: "#555" }));
  cord.position.set(0.3, 8.6, 0); scene.add(cord);
  const bulb = new THREE.PointLight("#ffd9a8", 12, 8); bulb.position.set(0.3, 6.0, 0); scene.add(bulb);
  camera.position.set(0.4, 3.7, 8.2);
  camera.lookAt(0.2, 2.4, 0);
  window.renderFrame = () => { renderer.render(scene, camera); return true; };
} else {
  // ----- Grande tête de robot dans un décor bleu, flot de cubes qui la traverse -----
  const BG = new THREE.Color("#0d3f8f");
  scene.background = BG;
  scene.fog = new THREE.Fog(BG, 22, 60);
  scene.environmentIntensity = 0.75;
  const sun = new THREE.DirectionalLight("#e6f0ff", 2.8);
  sun.position.set(-8, 12, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
  scene.add(sun, new THREE.HemisphereLight("#cfe2ff", "#0a2a66", 0.9));
  // sol réfléchissant bleu (eau calme)
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: "#123f8c", roughness: 0.55, metalness: 0.1 }));
  sea.rotation.x = -Math.PI / 2;
  sea.receiveShadow = true;
  scene.add(sea);
  // tête géante (le robot émerge de l'eau)
  const head = makeRobot({ body: "#f1f5fb", eye: "#8fdcff", glow: "#5fb4ff", scale: 3.1 });
  head.position.set(4.8, 3.0, -2);
  head.rotation.y = -0.38;
  scene.add(head);
  // couronne de cubes sur le dessus (comme une pensée qui germe)
  const crownMat = new THREE.MeshPhysicalMaterial({ color: "#ff8a3d", roughness: 0.25, clearcoat: 1 });
  const crown = new THREE.InstancedMesh(new RoundedBoxGeometry(0.42, 0.42, 0.42, 2, 0.06), crownMat, 34);
  crown.castShadow = true;
  scene.add(crown);
  const crownData = Array.from({ length: 34 }, (_, i) => ({ a: (i / 34) * Math.PI * 2, r: rand(1.6, 2.6), h: rand(0, 0.5), s: rand(0.7, 1.15), ph: rand(0, 6.28) }));
  // flot de cubes : ruban qui passe à travers la scène
  const N = 1500;
  const cubeMat = new THREE.MeshPhysicalMaterial({ roughness: 0.12, clearcoat: 1, transparent: true, opacity: 0.9 });
  const stream = new THREE.InstancedMesh(new RoundedBoxGeometry(0.16, 0.16, 0.16, 2, 0.03), cubeMat, N);
  scene.add(stream);
  const sData = Array.from({ length: N }, () => ({ u: rnd(), off: new THREE.Vector3(rand(-0.9, 0.9), rand(-0.7, 0.7), rand(-0.9, 0.9)), s: rand(0.5, 1.3), spin: rand(-3, 3) }));
  const cA = new THREE.Color("#ffffff"), cB = new THREE.Color("#7cc4ff"), cC = new THREE.Color("#ff9a5c");
  sData.forEach((d, i) => stream.setColorAt(i, new THREE.Color().copy(cB).lerp(rnd() < 0.5 ? cA : cC, rnd() * 0.8)));
  stream.instanceColor.needsUpdate = true;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-16, 5.2, 4), new THREE.Vector3(-6, 4.6, 1), new THREE.Vector3(1, 3.6, -0.5),
    new THREE.Vector3(4.6, 2.9, -1.6), new THREE.Vector3(9, 2.2, -1), new THREE.Vector3(18, 1.4, 2),
  ]);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  camera.position.set(-1.5, 3.4, 18);
  camera.lookAt(0.4, 3.5, 0);
  window.renderFrame = (t) => {
    const T = t * Math.PI * 2;
    head.position.y = 3.0 + Math.sin(T) * 0.12;
    head.rotation.y = -0.38 + Math.sin(T) * 0.05;
    const blink = (t * 2) % 1 > 0.94 ? 0.15 : 1;
    head.userData.eyes.forEach((ey) => (ey.scale.y = blink));
    crownData.forEach((d, i) => {
      const top = new THREE.Vector3(Math.cos(d.a) * d.r * 0.47, 3.25 + d.h + Math.sin(T * 2 + d.ph) * 0.06, Math.sin(d.a) * d.r * 0.43);
      top.applyAxisAngle(new THREE.Vector3(0, 1, 0), head.rotation.y).add(head.position);
      e.set(d.ph, d.ph + T * 0.3, 0); q.setFromEuler(e); sc.setScalar(d.s);
      m4.compose(top, q, sc); crown.setMatrixAt(i, m4);
    });
    crown.instanceMatrix.needsUpdate = true;
    sData.forEach((d, i) => {
      const u = (d.u + t) % 1;
      curve.getPoint(u, p);
      const spread = 0.6 + Math.sin(u * Math.PI) * 1.4;
      p.addScaledVector(d.off, spread);
      e.set(T * d.spin, T * d.spin * 0.6, 0); q.setFromEuler(e);
      sc.setScalar(d.s * (0.6 + Math.sin(u * Math.PI) * 0.6));
      m4.compose(p, q, sc); stream.setMatrixAt(i, m4);
    });
    stream.instanceMatrix.needsUpdate = true;
    camera.position.x = -1.5 + Math.sin(T) * 0.5;
    camera.lookAt(0.4, 3.5, 0);
    renderer.render(scene, camera);
    return true;
  };
}
window.ready = true;
</script>
</body>
</html>
